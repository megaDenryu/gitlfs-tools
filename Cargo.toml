[workspace]
resolver = "3"
members = [
    "crates/gitlfs-tools-domain",
    "crates/gitlfs-tools-storage-port",
    "crates/gitlfs-tools-config",
    "crates/gitlfs-tools-transfer",
    "crates/gitlfs-tools-rclone",
    "crates/gitlfs-tools-local",
    "crates/gitlfs-tools-protocol",
    "crates/gitlfs-tools-cli",
    "xtask",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/megaDenryu/gitlfs-tools"

[workspace.dependencies]
gitlfs-tools-domain = { path = "crates/gitlfs-tools-domain" }
gitlfs-tools-storage-port = { path = "crates/gitlfs-tools-storage-port" }
gitlfs-tools-config = { path = "crates/gitlfs-tools-config" }
gitlfs-tools-transfer = { path = "crates/gitlfs-tools-transfer" }
gitlfs-tools-rclone = { path = "crates/gitlfs-tools-rclone" }
gitlfs-tools-local = { path = "crates/gitlfs-tools-local" }
gitlfs-tools-protocol = { path = "crates/gitlfs-tools-protocol" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
directories = "6"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
as_conversions = "deny"
panic = "deny"

[profile.dev.package."*"]
opt-level = 2
